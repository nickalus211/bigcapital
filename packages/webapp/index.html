<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicons/favicon-32.ico" sizes="32x32" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Bigcapital Financial Managment Software"
    />
    <link rel="modulepreload" href="/manifest.json" />
    <title>Bigcapital</title>
  </head>
  <body>
    <script>
      // Applies the saved theme before first paint (see src/hooks/useTheme.ts).
      (function () {
        var preference = 'dark';
        try {
          preference = localStorage.getItem('theme') || 'dark';
        } catch (e) {}
        var isDark =
          preference === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : preference !== 'light';

        // The payment portal pages are always light.
        if (window.location.pathname.startsWith('/payment')) {
          isDark = false;
        }
        document.documentElement.classList.toggle('bp4-dark', isDark);
        document.body.classList.toggle('bp4-dark', isDark);
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="nprogress"></div>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/flexboxgrid/6.3.1/flexboxgrid.min.css"
      type="text/css"
    />
    <script src="https://app.lemonsqueezy.com/js/lemon.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
